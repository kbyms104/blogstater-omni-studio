<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgSlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="nibBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="cardDrop" x="-12%" y="-12%" width="124%" height="128%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity="0.38" />
    </filter>
  </defs>

  <!-- Outer Dark Slate Squircle Base -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bgSlate)" />
  <rect x="22" y="22" width="468" height="468" rx="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="4" />

  <!-- Layered Blue Editorial Accent Card -->
  <rect x="132" y="70" width="284" height="316" rx="48" fill="#2563EB" />

  <!-- Crisp White Editorial Document Card -->
  <rect x="86" y="98" width="322" height="332" rx="50" fill="#FFFFFF" filter="url(#cardDrop)" />

  <!-- Editorial Header Bar & Accent Dot -->
  <rect x="130" y="138" width="84" height="14" rx="7" fill="#CBD5E1" />
  <circle cx="358" cy="145" r="9" fill="#2563EB" />

  <!-- Bold Geometric "B" Monogram -->
  <path
    d="M132 178 H222 C256 178 278 196 278 223 C278 243 266 256 248 263 C270 270 284 287 284 311 C284 343 259 362 220 362 H132 Z
       M174 211 V250 H215 C230 250 239 242 239 230.5 C239 218.5 230 211 215 211 Z
       M174 281 V328 H218 C235 328 245 319.5 245 304.5 C245 289.5 235 281 218 281 Z"
    fill="#0F172A"
    fill-rule="evenodd"
  />

  <!-- Crisp Fountain Pen Nib Symbol -->
  <g transform="translate(320, 316) rotate(-32) scale(0.92)">
    <!-- Smooth unified white halo for separation inside the card -->
    <path
      d="M0 -84 L56 22 L42 64 L42 86 L-42 86 L-42 64 L-56 22 Z"
      fill="#FFFFFF"
      stroke="#FFFFFF"
      stroke-width="22"
      stroke-linejoin="round"
    />
    <!-- Vibrant Blue Pen Nib -->
    <path
      d="M0 -84 L54 20 L39 60 L-39 60 L-54 20 Z"
      fill="url(#nibBlue)"
    />
    <!-- Nib Collar Base -->
    <rect x="-41" y="64" width="82" height="22" rx="8" fill="#0F172A" />
    <!-- Ink Slit & Breather Circle -->
    <rect x="-4.5" y="-82" width="9" height="72" rx="4" fill="#FFFFFF" />
    <circle cx="0" cy="-2" r="14" fill="#FFFFFF" />
  </g>
</svg>
